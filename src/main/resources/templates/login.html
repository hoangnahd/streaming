<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · Streaming Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .animate-fade-in-up { animation: fade-in-up 0.45s ease-out forwards; }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

        /* Static gradient glows — pure CSS, no images/JS, negligible render cost */
        .glow-a {
            background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
        }
        .glow-b {
            background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, transparent 70%);
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-up, .animate-fade-in { animation: none; }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-950 flex items-center justify-center p-4 font-sans text-gray-200 selection:bg-indigo-500/30 relative overflow-hidden">

    <!-- Ambient background glows (decorative only, no layout impact) -->
    <div class="glow-a absolute -top-32 -left-32 w-96 h-96 rounded-full pointer-events-none"
         aria-hidden="true"></div>

    <div class="glow-b absolute -bottom-32 -right-32 w-96 h-96 rounded-full pointer-events-none"
         aria-hidden="true"></div>


    <div class="w-full max-w-md relative animate-fade-in-up">

        <!-- App header -->
        <div class="flex flex-col items-center mb-6 text-center">

            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-sky-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 mb-3">

                <svg class="w-6 h-6 text-white"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                    </path>

                </svg>

            </div>

            <h1 class="text-xl font-semibold text-white tracking-tight">
                Streaming Application
            </h1>

            <p class="text-sm text-gray-400 mt-1">
                Sign in to continue
            </p>

        </div>


        <div class="bg-gray-900/70 backdrop-blur border border-gray-800 rounded-2xl shadow-2xl shadow-black/40 p-8">


            <!--
                Spring Security form login

                IMPORTANT:
                The backend must have:

                .formLogin(form -> form
                    .loginPage("/login")
                    .loginProcessingUrl("/login")
                )

                The browser sends:

                POST /login
                username=...
                password=...
            -->
            <form action="/login"
                  method="post"
                  class="space-y-5"
                  novalidate>


                <!-- Security authentication error -->

                <div id="securityError"
                     class="hidden animate-fade-in bg-red-500/10 border border-red-500/30 flex items-start gap-3 p-3 rounded-lg">

                    <svg class="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>

                    </svg>

                    <p class="text-sm text-red-400 font-medium">
                        Invalid username or password.
                    </p>

                </div>


                <!-- Username -->

                <div class="space-y-1.5">

                    <label for="username"
                           class="block text-sm font-medium text-gray-300">
                        Username
                    </label>

                    <div class="relative">

                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 pointer-events-none">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                                </path>

                            </svg>

                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            autofocus
                            class="w-full bg-gray-950/60 border border-gray-700 rounded-lg pl-10 pr-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 transition-colors duration-150 focus:border-indigo-500 focus:ring-indigo-500/20"
                        />

                    </div>

                    <p id="usernameError"
                       class="hidden text-xs text-red-400 mt-1">
                    </p>

                </div>


                <!-- Password -->

                <div class="space-y-1.5">

                    <label for="password"
                           class="block text-sm font-medium text-gray-300">
                        Password
                    </label>

                    <div class="relative">

                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 pointer-events-none">

                            <svg class="w-4 h-4"
                                 fill="none"
                                 stroke="currentColor"
                                 viewBox="0 0 24 24">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                </path>

                            </svg>

                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            class="w-full bg-gray-950/60 border border-gray-700 rounded-lg pl-10 pr-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:ring-2 transition-colors duration-150 focus:border-indigo-500 focus:ring-indigo-500/20"
                        />

                    </div>

                    <p id="passwordError"
                       class="hidden text-xs text-red-400 mt-1">
                    </p>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-sky-500 hover:from-indigo-500 hover:to-sky-400 text-white font-semibold py-2.5 px-4 rounded-lg transition-all duration-150 shadow-lg shadow-indigo-500/20 active:scale-[0.99]">

                    Sign In

                </button>

            </form>

        </div>

    </div>


    <!-- Handle Spring Security's ?error=true -->
    <script>

        const params = new URLSearchParams(window.location.search);

        if (params.has("error")) {

            const securityError =
                document.getElementById("securityError");

            securityError.classList.remove("hidden");

        }

    </script>

</body>
</html>
